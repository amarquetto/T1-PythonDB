{% extends 'base.html' %}
{% block titulo %}Novo Funcionario — PataFeliz{% endblock %}

{% block conteudo %}

<div class="mb-4">
  <h1 class="pagina-titulo mb-1">
    <i class="bi bi-person-plus-fill me-2 text-laranja"></i>Novo Funcionario
  </h1>
  <p class="text-muted small mb-0">Preencha os dados para cadastrar um novo funcionario</p>
</div>

<div class="row">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">

        <form method="POST" action="{{ url_for('inserir_usuario') }}" novalidate>

          <div class="mb-3">
            <label for="nome" class="form-label">Nome completo <span class="texto-obrigatorio">*</span></label>
            <input type="text" class="form-control" id="nome" name="nome"
                   placeholder="Ex.: Ana Paula Ferreira" required maxlength="255" />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail <span class="texto-obrigatorio">*</span></label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="Ex.: ana@patafeliz.com" required />
            <div class="form-text">Sera usado para login no sistema.</div>
          </div>

          <div class="mb-3">
            <label for="id_funcao" class="form-label">Funcao</label>
            <select class="form-select" id="id_funcao" name="id_funcao">
              <option value="">Sem funcao definida</option>
              {% for f in funcoes %}
              <option value="{{ f.id_funcao }}">{{ f.nome_funcao }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label for="senha" class="form-label">Senha <span class="texto-obrigatorio">*</span></label>
            <input type="password" class="form-control" id="senha" name="senha"
                   placeholder="Minimo 6 caracteres" required minlength="6" />
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-laranja px-4">
              <i class="bi bi-check-lg me-1"></i>Salvar
            </button>
            <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary px-4">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
