{% extends 'base.html' %}
{% block titulo %}Editar Funcionario — PataFeliz{% endblock %}

{% block conteudo %}

<div class="mb-4">
  <h1 class="pagina-titulo mb-1">
    <i class="bi bi-person-fill me-2 text-laranja"></i>Editar Funcionario
  </h1>
  <p class="text-muted small mb-0">Altere os dados do funcionario abaixo</p>
</div>

<div class="row">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">

        <form method="POST" action="{{ url_for('editar_usuario', id_funcionario=usuario.id_funcionario) }}" novalidate>

          <div class="mb-3">
            <label for="nome" class="form-label">Nome completo <span class="texto-obrigatorio">*</span></label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ usuario.nome }}" required maxlength="255" />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail <span class="texto-obrigatorio">*</span></label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ usuario.email }}" required />
          </div>

          <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de acesso <span class="texto-obrigatorio">*</span></label>
            <select class="form-select" id="tipo" name="tipo" required>
              <option value="admin" {% if usuario.tipo == 'admin' %}selected{% endif %}>Administrador - acesso total</option>
              <option value="veterinario" {% if usuario.tipo == 'veterinario' %}selected{% endif %}>Veterinario - acesso a pets e servicos</option>
              <option value="funcionario" {% if usuario.tipo == 'funcionario' %}selected{% endif %}>Funcionario - acesso basico</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="id_funcao" class="form-label">Funcao</label>
            <select class="form-select" id="id_funcao" name="id_funcao">
              <option value="">Sem funcao definida</option>
              {% for f in funcoes %}
              <option value="{{ f.id_funcao }}" {% if usuario.id_funcao == f.id_funcao %}selected{% endif %}>
                {{ f.nome_funcao }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="ativo" class="form-label">Status</label>
            <select class="form-select" id="ativo" name="ativo">
              <option value="1" {% if usuario.ativo %}selected{% endif %}>Ativo</option>
              <option value="0" {% if not usuario.ativo %}selected{% endif %}>Inativo</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="senha" class="form-label">Nova senha</label>
            <input type="password" class="form-control" id="senha" name="senha"
                   placeholder="Deixe em branco para nao alterar" minlength="6" />
            <div class="form-text">Preencha apenas se quiser alterar a senha.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-laranja px-4">
              <i class="bi bi-check-lg me-1"></i>Salvar
            </button>
            <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary px-4">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
