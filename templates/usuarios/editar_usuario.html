{% extends 'base.html' %}
{% block titulo %}Editar Usuário — PataFeliz{% endblock %}

{% block conteudo %}

<div class="mb-4">
  <h1 class="pagina-titulo mb-1">
    <i class="bi bi-person-gear me-2 text-laranja"></i>Editar Usuário
  </h1>
  <p class="text-muted small mb-0">Altere os dados do usuário no sistema</p>
</div>

<div class="row">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">

        <form method="POST" action="{{ url_for('editar_usuario', usuario_id=usuario.id) }}" novalidate>

          <div class="mb-3">
            <label for="nome" class="form-label">
              Nome completo <span class="texto-obrigatorio">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="nome"
              name="nome"
              value="{{ usuario.nome }}"
              placeholder="Ex.: Ana Paula Ferreira"
              required
              maxlength="100"
            />
            <div class="form-text">Nome que será exibido no sistema.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">
              E-mail <span class="texto-obrigatorio">*</span>
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              value="{{ usuario.email }}"
              placeholder="Ex.: ana@patafeliz.com"
              required
            />
            <div class="form-text">Será usado para login no sistema.</div>
          </div>

          <div class="mb-3">
            <label for="perfil" class="form-label">
              Perfil de acesso <span class="texto-obrigatorio">*</span>
            </label>
            <select class="form-select" id="perfil" name="perfil" required>
              <option value="Administrador" {% if usuario.perfil == 'Administrador' %}selected{% endif %}>Administrador — acesso total ao sistema</option>
              <option value="Veterinário"   {% if usuario.perfil == 'Veterinário'   %}selected{% endif %}>Veterinário — acesso a prontuários e consultas</option>
              <option value="Atendente"     {% if usuario.perfil == 'Atendente'     %}selected{% endif %}>Atendente — agendamentos e atendimento ao cliente</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="ativo" class="form-label">Status</label>
            <select class="form-select" id="ativo" name="ativo">
              <option value="Sim" {% if usuario.ativo == 'Sim' %}selected{% endif %}>Ativo</option>
              <option value="Não" {% if usuario.ativo == 'Não' %}selected{% endif %}>Inativo</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-laranja px-4">
              <i class="bi bi-check-lg me-1"></i>Salvar alterações
            </button>
            <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary px-4">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
