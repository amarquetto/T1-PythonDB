{% extends 'base.html' %}
{% block titulo %}Editar Servico — PataFeliz{% endblock %}

{% block conteudo %}

<div class="mb-4">
  <h1 class="pagina-titulo mb-1">
    <i class="bi bi-tools me-2 text-laranja"></i>Editar Servico
  </h1>
  <p class="text-muted small mb-0">Altere os dados do servico abaixo</p>
</div>

<div class="row">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">

        <form method="POST" action="{{ url_for('editar_servico', id_servico=servico.id_servico) }}" novalidate>

          <div class="mb-3">
            <label for="nome" class="form-label">Nome do servico <span class="texto-obrigatorio">*</span></label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ servico.nome }}" required maxlength="255" />
          </div>

          <div class="mb-3">
            <label for="categoria" class="form-label">Categoria <span class="texto-obrigatorio">*</span></label>
            <select class="form-select" id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="Estetica" {% if servico.categoria == 'Estetica' %}selected{% endif %}>Estetica</option>
              <option value="Saude" {% if servico.categoria == 'Saude' %}selected{% endif %}>Saude</option>
              <option value="Hospedagem" {% if servico.categoria == 'Hospedagem' %}selected{% endif %}>Hospedagem</option>
              <option value="Treinamento" {% if servico.categoria == 'Treinamento' %}selected{% endif %}>Treinamento</option>
              <option value="Outro" {% if servico.categoria == 'Outro' %}selected{% endif %}>Outro</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="preco" class="form-label">Preco (R$) <span class="texto-obrigatorio">*</span></label>
            <input type="number" step="0.01" class="form-control" id="preco" name="preco"
                   value="{{ servico.preco }}" required min="0" />
          </div>

          <div class="mb-3">
            <label for="duracao" class="form-label">Duracao</label>
            <input type="text" class="form-control" id="duracao" name="duracao"
                   value="{{ servico.duracao }}" placeholder="Ex.: 1h, 45min, diaria" maxlength="30" />
          </div>

          <div class="mb-4">
            <label for="disponivel" class="form-label">Disponivel</label>
            <select class="form-select" id="disponivel" name="disponivel">
              <option value="Sim" {% if servico.disponivel == 'Sim' %}selected{% endif %}>Sim</option>
              <option value="Nao" {% if servico.disponivel == 'Nao' %}selected{% endif %}>Nao</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-laranja px-4">
              <i class="bi bi-check-lg me-1"></i>Salvar
            </button>
            <a href="{{ url_for('listar_servicos') }}" class="btn btn-outline-secondary px-4">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
